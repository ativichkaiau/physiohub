<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cardiovascular system — PLACEHOLDER schematic.
  Final asset will come from the tracing pipeline; this file exists so the
  engine (event handling, detail-panel resolution, hash routing) can be
  validated end-to-end. Five structures are wired per the SVG_CONTRACT.

  Orientation: viewer's left = patient's right (standard anatomical view).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  data-system="cv"
  role="img"
  aria-label="Cardiovascular system schematic"
>
  <!-- Decorative pericardial silhouette + midline septum (non-interactive) -->
  <g class="decor">
    <path
      d="M 110 220
         C 110 140, 220 110, 300 150
         C 380 110, 490 140, 490 220
         L 490 400
         C 490 500, 390 540, 300 540
         C 210 540, 110 500, 110 400 Z"
      fill="none"
      stroke="var(--svg-decor)"
      stroke-width="1.5"
      stroke-dasharray="3 5"
    />
    <line x1="300" y1="220" x2="300" y2="520"
          stroke="var(--svg-decor)" stroke-width="0.8" stroke-dasharray="2 4"/>
    <text x="160" y="98" class="svg-label" fill="var(--svg-label)" font-size="11"
          letter-spacing="2">CARDIOVASCULAR — PLACEHOLDER</text>
  </g>

  <!-- Ascending aorta — vertical tube exiting the top of the left ventricle -->
  <g id="cv_ascending_aorta"
     class="structure"
     data-system="cv"
     data-structure="ascending_aorta"
     tabindex="0"
     role="button"
     aria-label="Ascending aorta">
    <title>Ascending Aorta</title>
    <path
      d="M 318 220
         Q 308 130 360 70
         L 420 70
         Q 458 130 432 220 Z"
      fill="var(--svg-fill)"
      stroke="var(--svg-stroke)"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>

  <!-- Aortic valve — horizontal ellipse at the LV outflow tract -->
  <g id="cv_aortic_valve"
     class="structure"
     data-system="cv"
     data-structure="aortic_valve"
     tabindex="0"
     role="button"
     aria-label="Aortic valve">
    <title>Aortic Valve</title>
    <ellipse
      cx="375" cy="230" rx="56" ry="14"
      fill="var(--svg-fill)"
      stroke="var(--svg-stroke)"
      stroke-width="2"
    />
  </g>

  <!-- Left ventricle — large rounded chamber (viewer's right / patient's left) -->
  <g id="cv_left_ventricle"
     class="structure"
     data-system="cv"
     data-structure="left_ventricle"
     tabindex="0"
     role="button"
     aria-label="Left ventricle">
    <title>Left Ventricle</title>
    <path
      d="M 305 250
         L 470 250
         L 470 440
         Q 470 510 385 510
         Q 305 510 305 440 Z"
      fill="var(--svg-fill)"
      stroke="var(--svg-stroke)"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <text x="388" y="385" text-anchor="middle"
          font-size="13" font-weight="600"
          fill="var(--svg-label)" pointer-events="none">LV</text>
  </g>

  <!-- Mitral valve — leaflet between (schematic) inflow and LV -->
  <g id="cv_mitral_valve"
     class="structure"
     data-system="cv"
     data-structure="mitral_valve"
     tabindex="0"
     role="button"
     aria-label="Mitral valve">
    <title>Mitral Valve</title>
    <ellipse
      cx="318" cy="280" rx="14" ry="38"
      fill="var(--svg-fill)"
      stroke="var(--svg-stroke)"
      stroke-width="2"
    />
  </g>

  <!-- Right atrium — chamber on viewer's left / patient's right -->
  <g id="cv_right_atrium"
     class="structure"
     data-system="cv"
     data-structure="right_atrium"
     tabindex="0"
     role="button"
     aria-label="Right atrium">
    <title>Right Atrium</title>
    <path
      d="M 140 200
         L 285 200
         L 285 380
         L 140 380
         Q 115 380 115 355
         L 115 225
         Q 115 200 140 200 Z"
      fill="var(--svg-fill)"
      stroke="var(--svg-stroke)"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <text x="200" y="295" text-anchor="middle"
          font-size="13" font-weight="600"
          fill="var(--svg-label)" pointer-events="none">RA</text>
  </g>
</svg>
